  h1,h2,h3{font-family:'Quicksand', system-ui, sans-serif; margin:0;}
  .card{
    width:100%; max-width: 400px; background: rgba(255,255,255,0.62);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 22px; padding: 34px 30px 28px;
    box-shadow: 0 25px 60px -20px rgba(20,10,15,0.45), 0 2px 8px rgba(51,38,43,0.04);
    position: relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:-40px; right:-40px; width:130px; height:130px;
    background: radial-gradient(circle, var(--blush-2) 0%, transparent 70%);
  }
  .mark{display:flex; align-items:center; gap:10px; margin-bottom: 6px;}
  .mark .bud{font-size:26px; line-height:1;}
  .mark span{font-size:22px; font-weight:700; letter-spacing:0.2px;}
  .sub{color:var(--ink-soft); font-size:14.5px; margin-top:4px; margin-bottom:26px; line-height:1.5;}
  label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px;}
  .field{margin-bottom:16px; position:relative;}
  input[type=email],input[type=password],input[type=text]{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
    font-size:15px; font-family:inherit; background:#FFFCFD; color:var(--ink);
    outline:none; transition: border-color .15s ease;
  }
  input:focus{border-color: var(--sakura);}
  .eye{position:absolute; right:12px; top:37px; cursor:pointer; font-size:15px; user-select:none; color: var(--ink-soft);}
  .row{display:flex; align-items:center; justify-content:space-between; margin: 4px 0 22px;}
  .remember{display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-soft);}
  .remember input{accent-color: var(--sakura); width:15px; height:15px;}
  .link{color: var(--sakura-deep); font-size:13.5px; font-weight:600; cursor:pointer; background:none; border:none; padding:0; font-family:inherit;}
  .btn{
    width:100%; padding:13px; border-radius:12px; border:none; cursor:pointer;
    background: linear-gradient(135deg, var(--sakura), var(--sakura-deep));
    color:#fff; font-weight:600; font-size:15px; font-family:inherit;
    transition: transform .08s ease, box-shadow .15s ease;
    box-shadow: 0 8px 20px -8px rgba(201,79,118,0.6);
  }
  .btn:active{transform: scale(0.98);}
  .btn:disabled{opacity:0.55; cursor:not-allowed; box-shadow:none;}
  .btn.ghost{background:none; box-shadow:none; color: var(--sakura-deep); border:1.5px solid var(--line);}
  .foot{text-align:center; margin-top:22px; font-size:13.5px; color: var(--ink-soft);}
  .msg{font-size:13px; border-radius:10px; padding:10px 12px; margin-bottom:16px; line-height:1.4;}
  .msg.err{background:#FBEAEA; color: var(--danger);}
  .msg.ok{background:#EAF5EE; color: var(--success);}
  .msg.demo{background:#FFF4E0; color:#8A6113;}
  .home{text-align:center;}
  .home .bud{font-size:44px;}
  .home h2{margin: 14px 0 6px;}
  .home p{color:var(--ink-soft); font-size:14.5px; margin-bottom: 26px;}
  .spinner-wrap{display:flex; align-items:center; justify-content:center; padding: 40px 0;}
  #root{position:relative; z-index:1; display:flex; justify-content:center;}
  .petals-bg{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .petals-bg svg{position:absolute; opacity:0.5;}
  .petals-bg svg:nth-child(1){top:8%; left:6%; width:54px; transform:rotate(-15deg);}
  .petals-bg svg:nth-child(2){top:70%; left:10%; width:38px; transform:rotate(40deg); opacity:0.35;}
  .petals-bg svg:nth-child(3){top:18%; left:85%; width:46px; transform:rotate(70deg);}
  .petals-bg svg:nth-child(4){top:78%; left:82%; width:60px; transform:rotate(-30deg); opacity:0.4;}
  .petals-bg svg:nth-child(5){top:45%; left:3%; width:30px; transform:rotate(10deg); opacity:0.3;}
  .sakura-art{position:fixed; pointer-events:none; z-index:0; opacity:0.9;}
  .sakura-art.top{top:-30px; left:-30px; width:220px; height:220px;}
  .sakura-art.bottom{bottom:-40px; right:-30px; width:260px; height:260px; transform:scaleX(-1) rotate(15deg);}
  .card{position:relative; z-index:1;}
  @media (max-width:480px){ .sakura-art.top{width:150px; height:150px;} .sakura-art.bottom{width:180px; height:180px;} }
  body.auth-bg .card{
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  select{width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); font-size:15px; font-family:inherit; background:#FFFCFD; color:var(--ink); outline:none;}
  select:focus{border-color: var(--sakura);}
  body.app-mode{background-image: radial-gradient(120% 70% at 50% -10%, #3B1D6B 0%, transparent 60%) !important; background-color:#0E0A1A !important; background-attachment:scroll !important; padding:0;}
  #root{width:100%; display:flex; justify-content:center;}
  .shell{width:100%; max-width:520px; height:100dvh; display:flex; flex-direction:column; background:#140E26; color:#F4EEFF; overflow:hidden; position:relative; padding-top:env(safe-area-inset-top,0px);}
  @media (min-width:480px){ body.app-mode{padding:24px 16px;} .shell{border-radius:28px; height:min(100dvh - 48px, 860px); border:1px solid #2E2250;} }
  .top{display:flex; align-items:center; justify-content:center; gap:8px; padding:16px 18px 8px; font-family:'Quicksand',sans-serif; font-weight:700; font-size:18px;}
  .main{flex:1; overflow-y:auto; padding:8px 18px 16px; flex-direction:column;}
  .nav{display:flex; border-top:1px solid #2E2250; background:#110B20; padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));}
  .nav button{flex:1; min-width:0; white-space:nowrap; background:none; border:none; color:#9A8DBA; font-family:inherit; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; padding:4px 0;}
  .nav button span{font-size:20px; filter:grayscale(1) opacity(.7);}
  .nav button.on{color:#B07CFF; font-weight:600;}
  .nav button.on span{filter:none;}
  .deck{position:relative; flex:1; min-height:360px;}
  .pcard{position:absolute; inset:0; border-radius:24px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:20px; touch-action:pan-y; user-select:none; cursor:grab; background:linear-gradient(160deg,#6D3BD2,#2A1760 60%,#140E26);}
  .pcard .big{position:absolute; top:12%; left:0; right:0; text-align:center; font-size:120px; font-weight:700; opacity:.25; font-family:'Quicksand',sans-serif;}
  .pcard::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 40%,rgba(10,6,20,.85) 100%); pointer-events:none;}
  .pcard > *:not(.big){position:relative; z-index:1;}
  .pcard h3{font-size:26px;}
  .meta{font-size:13.5px; color:#D8CCF5; margin-top:4px;}
  .tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .tag{background:rgba(255,255,255,.14); border-radius:999px; padding:5px 12px; font-size:12.5px;}
  .sample{position:absolute !important; top:14px; left:14px; z-index:2; background:rgba(0,0,0,.45); font-size:11px; padding:4px 10px; border-radius:999px;}
  .acts{display:flex; justify-content:center; gap:28px; padding:16px 0 4px;}
  .round{width:64px; height:64px; border-radius:50%; border:none; font-size:26px; cursor:pointer; color:#fff;}
  .round.no{background:#E5484D;} .round.yes{background:linear-gradient(135deg,#9B5CFF,#6D3BD2);}
  .empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#B9ADD9; gap:8px; padding:40px 20px;}
  .empty b{color:#F4EEFF; font-size:18px; font-family:'Quicksand',sans-serif;}
  .you-row{background:#1C1436; border:1px solid #2E2250; border-radius:16px; padding:14px 16px; margin-bottom:10px; font-size:14px; line-height:1.5;}
  .avatar{width:96px; height:96px; border-radius:50%; background:var(--blush-2) center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--sakura-deep); margin:0 auto 8px; border:2px solid var(--line);}
  .photo-row{text-align:center; margin-bottom:18px;}
  .photo-row input{display:none;}
  .pcard.has-img .big{display:none;}
  .main{min-height:0;} .main.flush{padding:0;}
  .mini{border-radius:50%; background:#3A2C66 center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:#E4D7FF; font-weight:700; flex-shrink:0; cursor:pointer;}
  .sec{font-family:'Quicksand',sans-serif; font-weight:700; font-size:14px; color:#B9ADD9; margin:14px 0 8px;}
  .row-item{display:flex; align-items:center; gap:12px; background:#1C1436; border:1px solid #2E2250; border-radius:16px; padding:10px 12px; margin-bottom:8px;}
  .ri-info{flex:1; min-width:0; cursor:pointer;} .ri-info b{display:block; font-size:15px;}
  .ri-info .meta{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .ri-act{display:flex; flex-direction:column; gap:6px;}
  .btn.sm{width:auto; padding:8px 14px; font-size:13px; border-radius:10px;}
  .nav button span{position:relative;}
  .badge{position:absolute; top:-4px; right:-10px; min-width:17px; height:17px; border-radius:9px; background:#E5484D; color:#fff; font-size:10px; font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; padding:0 4px; filter:none;}
  .sheet{position:absolute; inset:0; z-index:20; background:#140E26; display:flex; flex-direction:column; overflow-y:auto; padding:0 18px 18px;}
  .sheet.center{align-items:center; justify-content:center; text-align:center; gap:12px;}
  .sheet-img{height:46%; min-height:260px; flex-shrink:0; margin:16px 0 14px; border-radius:24px; background:linear-gradient(160deg,#6D3BD2,#2A1760) center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:110px; font-weight:700; color:rgba(255,255,255,.25);}
  .sheet-body{flex:1;} .sheet-body h3{font-size:26px;} .sheet-body p{color:#D8CCF5; line-height:1.5;}
  .chat-head{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid #2E2250;}
  .chat-head .back{background:none; border:none; color:#C9B3FF; font-size:28px; cursor:pointer; padding:0 6px; line-height:1;}
  .chat-msgs{flex:1; min-height:0; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:6px;}
  .bub{max-width:78%; padding:9px 13px; border-radius:16px; font-size:14.5px; line-height:1.4; overflow-wrap:anywhere;}
  .bub.me{align-self:flex-end; background:linear-gradient(135deg,#9B5CFF,#6D3BD2); border-bottom-right-radius:5px;}
  .bub.them{align-self:flex-start; background:#2A2046; border-bottom-left-radius:5px;}
  .bub small{display:block; font-size:10.5px; opacity:.7; margin-top:3px;}
  .composer{display:flex; gap:8px; padding:10px 12px; border-top:1px solid #2E2250;}
  .composer input{flex:1; background:#1C1436 !important; color:#F4EEFF !important; border-color:#2E2250;}
  .composer button{width:46px; border:none; border-radius:12px; background:linear-gradient(135deg,#9B5CFF,#6D3BD2); color:#fff; font-size:18px; cursor:pointer;}
  .convo{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid #251A44; cursor:pointer;}
  .unread{background:#9B5CFF; color:#fff; border-radius:10px; min-width:20px; height:20px; font-size:11px; display:flex; align-items:center; justify-content:center; padding:0 6px;}
  .shell .btn{background:linear-gradient(135deg,#9B5CFF,#6D3BD2); box-shadow:none;}
  .shell .btn.ghost{background:none; border:1.5px solid #3A2C66; color:#C9B3FF;}

  }

function LoginView({go, route, prefillEmail}){
  const [email,setEmail]=useState(prefillEmail||'');
  const [pw,setPw]=useState('');

  const [remember,setRemember]=useState(true);
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  async function submit(e){
    e.preventDefault();
    setErr('');
    if(!validEmail(email)){ setErr('Enter a valid email address.'); return; }
    if(!pw){ setErr('Enter your password.'); return; }
    setLoading(true);
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });

      if(/confirm/i.test(error.message)){ go('checkEmail', {email, mode:'signup'}); return; }

    h(Message,{type:'err'}, err),

      h('div',{className:'field'}, h('label',null,'Email'), h('input',{type:'email',value:email,onChange:e=>setEmail(e.target.value),placeholder:'you@example.com',autoComplete:'email'})),

      ),

    ),
    h('div',{className:'foot'}, "New to Sakura? ", h('button',{className:'link',onClick:()=>go('signup')},'Create an account'))

function SignupView({go}){

    e.preventDefault();
    setErr('');
    if(!validEmail(email)){ setErr('Enter a valid email address.'); return; }

    if(pw!==pw2){ setErr('Passwords do not match.'); return; }

        h('span',{className:'eye', onClick:()=>setShow(!show)}, show?'🙈':'👁')

      h('div',{className:'field'}, h('label',null,'Confirm password'),
        h('input',{type: show?'text':'password', value:pw2, onChange:e=>setPw2(e.target.value), placeholder:'Re-enter password'})

const LOOKING = ['Friendship','Serious relationship','Casual dating','Friendship or relationship'];
function normGender(g){ const s=(g||'').trim().toLowerCase(); if(['man','male','m','boy'].includes(s)) return 'Man'; if(['woman','female','f','girl'].includes(s)) return 'Woman'; return ''; }
function isComplete(p){ return !!(p && p.display_name && p.birthday && p.location && p.looking_for && normGender(p.gender)); }
function ageFrom(b){
  if(!b) return null;
  const d=new Date(b), t=new Date();
  let a=t.getFullYear()-d.getFullYear();
  if(t.getMonth()<d.getMonth() || (t.getMonth()===d.getMonth() && t.getDate()<d.getDate())) a--;
  return a;
}

function resizeImage(file, max){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?resolve(b):reject(new Error('Could not process image')),'image/jpeg',0.85);
    };
    img.onerror=()=>reject(new Error('That file is not a readable image.'));
    img.src=url;
  });
}

  const [saving,setSaving]=useState(false); const [err,setErr]=useState('');

    const f=e.target.files && e.target.files[0]; if(!f) return;
    setErr(''); setUploading(true);
    try{
      const blob=await resizeImage(f,800);
      const path=user.id+'/'+Date.now()+'.jpg';
      const { error } = await sb.storage.from('avatars').upload(path, blob, {contentType:'image/jpeg'});

    onDone(row);
  }

  return h('div',{className:'card'},
    h(Logo),
    h('div',{className:'sub'}, sub),
    h(Message,{type:'err'}, err),
    h('form',{onSubmit:save},
      h('div',{className:'photo-row'},

      h('div',{className:'field'}, h('label',null,'Gender'), h('select',{value:gender,onChange:e=>setGender(e.target.value)}, h('option',{value:''},'Choose one'), h('option',{value:'Man'},'Man'), h('option',{value:'Woman'},'Woman'))),
      h('div',{className:'field'}, h('label',null,'Sexual orientation'), h('input',{type:'text',value:orientation,onChange:e=>setOrientation(e.target.value),placeholder:'e.g. Straight, Gay, Bisexual'})),

function fmtTime(t){

function SwipeTab({active, act, setSheet}){
  const [deck,setDeck]=useState(null);
  const [dx,setDx]=useState(0); const [fly,setFly]=useState(0);
  const startX=React.useRef(null);
  const empty = deck===null || deck.length===0;
  useEffect(()=>{
    if(!active || !empty) return;
    const load=()=>sb.rpc('get_discover_profiles').then(({data})=>setDeck(data||[]));
    load();
    const t=setInterval(load,15000);
    return ()=>clearInterval(t);
  },[active,empty]);
  function decide(action){
    const c = deck && deck[0]; if(!c || fly) return;
    setFly(action==='like'?1:-1);
    setTimeout(()=>{
      act(c.id, action==='like'?'like':'pass');
      setDeck(d=>d.slice(1)); setFly(0); setDx(0);
    },220);
  }
  function down(e){ startX.current=e.clientX; e.currentTarget.setPointerCapture(e.pointerId); }
  function move(e){ if(startX.current!==null) setDx(e.clientX-startX.current); }
  function up(){
    if(startX.current===null) return; startX.current=null;
    if(dx>90) decide('like'); else if(dx<-90) decide('pass');
    else { if(Math.abs(dx)<6) setSheet(deck[0]); setDx(0); }
  }
  if(deck===null) return h(Empty,{title:'Finding people…',text:''});
  const c = deck[0];
  if(!c) return h(Empty,{title:"You're all caught up",text:'No one new right now. New people show up here automatically.'},
    h('button',{className:'btn sm',style:{marginTop:10},onClick:()=>setDeck(null)},'Refresh'));
  const x = fly ? fly*480 : dx;
  return h('div',{style:{display:'flex',flexDirection:'column',flex:1}},
    h('div',{className:'deck'},
      h('div',{className:'pcard'+(c.avatar_url?' has-img':''), onPointerDown:down, onPointerMove:move, onPointerUp:up, onPointerCancel:up,
        style:{backgroundImage: c.avatar_url ? 'url('+c.avatar_url+')' : undefined, backgroundSize:'cover', backgroundPosition:'center', transform:'translateX('+x+'px) rotate('+(x/18)+'deg)', transition: startX.current===null ? 'transform .22s ease' : 'none'}},
        h('div',{className:'big'}, (c.display_name||'?')[0]),
        h('h3',null, c.display_name+(c.age?', '+c.age:'')),
        h('div',{className:'meta'}, c.location||''),
        c.bio ? h('div',{className:'meta'}, c.bio) : null,
        h('div',{className:'tags'}, c.looking_for ? h('span',{className:'tag'}, c.looking_for) : null)
      )
    ),
    h('div',{className:'acts'},
      h('button',{className:'round no',onClick:()=>decide('pass'),'aria-label':'Dislike'},'✕'),
      h('button',{className:'round yes',onClick:()=>decide('like'),'aria-label':'Like'},'♥')
    )
  );
}

function ChatScreen({match, me, back, setSheet, refresh}){
  const [msgs,setMsgs]=useState([]); const [text,setText]=useState(''); const [err,setErr]=useState('');
  const endRef=React.useRef(null);
  async function load(){
    const { data } = await sb.from('messages').select('*').eq('match_id',match.match_id).order('created_at',{ascending:true}).limit(300);
    if(!data) return;
    setMsgs(data);
    if(data.some(m=>m.sender_id!==me.id && !m.read_at)){ await sb.rpc('mark_read',{p_match:match.match_id}); refresh(); }
  }
  useEffect(()=>{
    load();
    const t=setInterval(load,3000);
    const ch=sb.channel('chat-'+match.match_id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'match_id=eq.'+match.match_id},()=>load()).subscribe();
    return ()=>{ clearInterval(t); sb.removeChannel(ch); };
  },[match.match_id]);
  useEffect(()=>{ if(endRef.current) endRef.current.scrollIntoView({block:'end'}); },[msgs.length]);
  async function send(e){
    e.preventDefault();
    const body=text.trim(); if(!body) return;
    setText(''); setErr('');
    const { error } = await sb.from('messages').insert({match_id:match.match_id,sender_id:me.id,body});
    if(error){ setText(body); setErr(error.message); return; }
    load(); refresh();
  }
  const lastMine=[...msgs].reverse().find(m=>m.sender_id===me.id);
  return h('div',{style:{flex:1,display:'flex',flexDirection:'column',minHeight:0}},
    h('div',{className:'chat-head'},
      h('button',{className:'back',onClick:back},'‹'),
      h(Avatar,{url:match.avatar_url,name:match.display_name,size:38,onClick:()=>setSheet(match)}),
      h('b',{onClick:()=>setSheet(match),style:{cursor:'pointer'}},match.display_name)),
    h('div',{className:'chat-msgs'},
      msgs.length===0 ? h(Empty,{title:'Say hi to '+match.display_name,text:'You matched. Send the first message.'}) : null,
      msgs.map(m=>h('div',{key:m.id,className:'bub '+(m.sender_id===me.id?'me':'them')}, m.body,
        h('small',null, fmtTime(m.created_at)+(lastMine && m.id===lastMine.id && m.read_at ? ' · Seen' : ''))
      )),
      h('div',{ref:endRef})),
    err ? h('div',{className:'msg err',style:{margin:'0 12px 6px'}},err) : null,
    h('form',{className:'composer',onSubmit:send},
      h('input',{type:'text',value:text,onChange:e=>setText(e.target.value),placeholder:'Type a message…',maxLength:2000}),
      h('button',{type:'submit','aria-label':'Send'},'➤'))
  );
}

function ChatTab({inbox, me, chatWith, setChatWith, setSheet, refresh}){
  if(chatWith) return h(ChatScreen,{match:chatWith,me,back:()=>{setChatWith(null); refresh();},setSheet,refresh});
  if(!inbox.matches.length) return h('div',{className:'main flush',style:{display:'flex'}}, h(Empty,{title:'No chats yet',text:'When you and someone like each other, you can chat here.'}));
  return h('div',{style:{padding:'8px 18px'}}, inbox.matches.map(m=>h('div',{key:m.match_id,className:'convo',onClick:()=>setChatWith(m)},
    h(Avatar,{url:m.avatar_url,name:m.display_name,size:52}),
    h('div',{className:'ri-info'}, h('b',null,m.display_name), h('div',{className:'meta'}, m.last_body ? (m.last_sender===me.id?'You: ':'')+m.last_body : 'Say hi!')),
    h('div',{style:{textAlign:'right'}}, m.last_at ? h('div',{className:'meta'},fmtTime(m.last_at)) : null, m.unread>0 ? h('div',{className:'unread',style:{marginLeft:'auto',marginTop:4}},m.unread) : null)
  )));
}

function YouTab({data, go}){
  const p = data.profile||{}; const age = ageFrom(p.birthday);
  async function logout(){ await sb.auth.signOut(); go('login'); }
  return h('div',null,
    h('div',{className:'avatar',style:p.avatar_url?{backgroundImage:'url('+p.avatar_url+')'}:{}}, p.avatar_url?null:((p.display_name||'?')[0])),
    h('div',{className:'you-row'}, h('b',null,(p.display_name||'You')+(age!==null?', '+age:'')), h('div',{className:'meta'}, [p.location,p.gender].filter(Boolean).join(' · ')), p.bio ? h('div',{className:'meta'},p.bio) : null),
    h('div',{className:'you-row'}, 'Looking for: '+(p.looking_for||'Not set')),
    h('button',{className:'btn',onClick:()=>go('editProfile',data)},'Edit profile'),
    h('button',{className:'btn ghost',style:{marginTop:10},onClick:()=>go('home',data)},'Back to welcome'),
    h('button',{className:'btn ghost',style:{marginTop:10},onClick:logout},'Log out')
  );
}

function MainApp({data, go}){
  const me = data.user;
  const [tab,setTab]=useState('swipe');
  const [inbox,setInbox]=useState({likes:[],matches:[],sugg:[]});
  const [seen,setSeen]=useState(new Date((data.profile && data.profile.notif_seen_at) || 0).getTime());
  const [chatWith,setChatWith]=useState(null);
  const [sheet,setSheet]=useState(null); const [pop,setPop]=useState(null);
  useEffect(()=>{ document.body.classList.add('app-mode'); return ()=>document.body.classList.remove('app-mode'); },[]);

  const refresh = React.useCallback(async ()=>{
    const [l,m,s] = await Promise.all([sb.rpc('get_likes_received'), sb.rpc('get_my_matches'), sb.rpc('get_suggestions')]);
    const st = {likes:l.data||[], matches:m.data||[], sugg:s.data||[]};
    setInbox(st); return st;
  },[]);
  useEffect(()=>{
    refresh();
    const t=setInterval(refresh,10000);
    const ch=sb.channel('inbox')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>refresh())
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'matches'},()=>refresh())
      .subscribe();
    return ()=>{ clearInterval(t); sb.removeChannel(ch); };
  },[]);

  async function act(target, action){
    const { error } = await sb.from('swipes').upsert({swiper_id:me.id,target_id:target,action,created_at:new Date().toISOString()},{onConflict:'swiper_id,target_id'});
    if(error) return;
    const st = await refresh();
    const m = st.matches.find(x=>x.other_id===target);
    if(action==='like' && m) setPop(m);
  }
  const unseen = inbox.likes.filter(l=>new Date(l.liked_at).getTime()>seen).length + inbox.matches.filter(m=>!m.last_body && new Date(m.matched_at).getTime()>seen).length;
  const unread = inbox.matches.reduce((n,m)=>n+m.unread,0);
  useEffect(()=>{
    if(tab==='notif' && unseen>0){
      const now=Date.now(); setSeen(now);
      sb.from('profiles').update({notif_seen_at:new Date(now).toISOString()}).eq('id',me.id);
    }
  },[tab,unseen]);
  useEffect(()=>{ if(tab==='notif' || tab==='chat') refresh(); },[tab]);
  function openChat(m){ setChatWith(m); setTab('chat'); }

  const tabs=[['swipe','🔥','Swiping',0],['notif','🔔','Notifications',tab==='notif'?0:unseen],['chat','💬','Chat',unread],['you','👤','You',0]];
  const pane=(id,child,flush)=>h('div',{className:'main'+(flush?' flush':''),style:{display: tab===id?'flex':'none'}}, child);
  return h('div',{className:'shell'},
    h('div',{className:'top'},'🌸 Sakura'),
    pane('swipe', h(SwipeTab,{active:tab==='swipe',act,setSheet})),
    pane('notif', h(NotifTab,{inbox,act,openChat,setSheet})),
    pane('chat', h(ChatTab,{inbox,me,chatWith,setChatWith,setSheet,refresh}), !!chatWith),
    pane('you', h(YouTab,{data,go})),
    h('div',{className:'nav'}, tabs.map(([id,icon,label,n])=>h('button',{key:id,className:tab===id?'on':'',onClick:()=>setTab(id)},
      h('span',null,icon,n>0?h('i',{className:'badge'},n>99?'99+':n):null), label))),
    sheet ? h(ProfileSheet,{p:sheet,onClose:()=>setSheet(null)}) : null,
    pop ? h('div',{className:'sheet center'},
      h('h2',null,"It's a match!"),
      h(Avatar,{url:pop.avatar_url,name:pop.display_name,size:110}),
      h('p',null,'You and '+pop.display_name+' liked each other. You are now friends.'),
      h('button',{className:'btn',onClick:()=>{setPop(null); openChat(pop);}},'Start chatting'),
      h('button',{className:'btn ghost',onClick:()=>setPop(null)},'Keep swiping')) : null
  );
}

function App(){
  const [view,setView]=useState('loading');
  const [data,setData]=useState({});
  const viewRef = React.useRef('loading');

  function go(next, d){ viewRef.current = next; setData(d||{}); setView(next); }

  async function route(user){
    const { data:row } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    go(isComplete(row) ? 'home' : 'onboarding', { user, profile: row || {} });
  }

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if(viewRef.current==='resetPassword') return;
      if(session) route(session.user); else go('login');
    });
    const { data: listener } = sb.auth.onAuthStateChange((event, session)=>{
      if(event === 'PASSWORD_RECOVERY'){ go('resetPassword'); return; }
      if(event === 'SIGNED_OUT'){ go('login'); return; }
      if(event === 'SIGNED_IN' && session && ['loading','login','signup','checkEmail','forgot'].includes(viewRef.current)){
        setTimeout(()=>route(session.user), 0);
      }
    });
    return ()=> listener.subscription.unsubscribe();
  },[]);

  if(view==='loading') return h('div',{className:'card'}, h('div',{className:'spinner-wrap'}, h(Logo)));
  if(view==='signup') return h(SignupView,{go});
  if(view==='checkEmail') return h(CheckEmailView,{data,go});
  if(view==='forgot') return h(ForgotView,{data,go});
  if(view==='resetPassword') return h(ResetPasswordView,{go,route});
  if(view==='onboarding') return h(ProfileForm,{user:data.user, profile:data.profile, title:'Set up your profile', sub:'Tell us a bit about you to finish creating your account.', submitLabel:'Finish and continue', onDone:(row)=>go('home',{user:data.user, profile:row})});
  if(view==='editProfile') return h(ProfileForm,{user:data.user, profile:data.profile, sub:'Update your profile details.', submitLabel:'Save changes', onDone:(row)=>go('home',{user:data.user, profile:row}), onCancel:()=>go('home',data)});
  if(view==='main') return h(MainApp,{data,go});
  if(view==='home') return h(HomeView,{data,go});
  return h(LoginView,{go, route, prefillEmail:data.email});
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
